services:
  - type: web
    name: firecrackers-firelens
    runtime: python
    # free sleeps after 15 idle minutes; starter stays on. Both have 512 MB,
    # which the in-memory index (about 130 MB at peak) fits.
    plan: free
    # The all-experiment index is over GitHub's file limit, so it is built
    # from the committed embeddings on every deploy (no network needed).
    buildCommand: >-
      pip install -r requirements.txt &&
      python -m src.vectorstore index
      --input-dir data/embeddings/openai-compatible/gwdg.qwen3-embedding-4b
      --database data/vectorstore/firelens.sqlite3
      --collection firelens-qwen3-embedding-4b
      --provider openai-compatible --model gwdg.qwen3-embedding-4b --dimension 2560
      --allow-duplicates
    startCommand: python -m src.api
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOST
        value: 0.0.0.0
      - key: FIRELENS_LLM_PROVIDER
        value: gemini
      - key: FIRELENS_LLM_MODEL
        value: gemini-2.5-flash
      - key: FIRELENS_LLM_MAX_OUTPUT_TOKENS
        value: "4000"
      - key: FIRELENS_EMBEDDING_BASE_URL
        value: https://ai-gateway.uni-paderborn.de/v1
      - key: FIRELENS_LLM_BASE_URL
        value: https://ai-gateway.uni-paderborn.de/v1
      - key: GEMINI_API_KEY
        sync: false
